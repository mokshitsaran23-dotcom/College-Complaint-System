version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: campuscare-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - campuscare-net

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: campuscare-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/college_complaints
      - JWT_SECRET=college-complaint-jwt-supersecret-2026
      - CORS_ORIGIN=*
    depends_on:
      - mongodb
    networks:
      - campuscare-net

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: campuscare-frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - backend
    networks:
      - campuscare-net

volumes:
  mongo_data:
    driver: local

networks:
  campuscare-net:
    driver: bridge
